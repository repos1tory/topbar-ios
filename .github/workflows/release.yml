name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.1)"
        required: true
      publish:
        description: "Create the release and update the APT repo"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  publish:
    uses: repos1tory/repos1tory.github.io/.github/workflows/publish-tweak.yml@main
    with:
      tag: ${{ github.event.inputs.tag || github.ref_name }}
      publish: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.publish == 'true' }}
      build_command: |
        rm -rf TopBar/packages plugins/*/packages
        make -C TopBar package FINALPACKAGE=1 TARGET=iphone:clang:latest:15.0
        for d in plugins/*/; do make -C "$d" package FINALPACKAGE=1 TARGET=iphone:clang:latest:15.0; done
      deb_glob: "**/packages/*.deb"
      group: tweaks
      theos: true
    secrets: inherit
